# Development-only; external Neon DB, do not deploy without code/tests/OIDC.
services:
  - type: web
    name: akashic-world-engine-dev
    runtime: docker
    region: singapore
    plan: free
    branch: main
    autoDeployTrigger: 'off'
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: AUTH_MODE
        value: oidc
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: '10000'
      - key: DB_POOL_SIZE
        value: '3'
      - key: JAVA_TOOL_OPTIONS
        value: '-XX:MaxRAMPercentage=60.0 -XX:InitialRAMPercentage=15.0'
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USER
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: JWT_ISSUER
        sync: false
      - key: JWT_AUDIENCE
        sync: false
      - key: JWT_JWKS_URL
        sync: false
