# Initial deployment is deliberately locked: health-only, no game endpoints.
# Configure Neon and OIDC securely before activating production game APIs.
services:
  - type: web
    name: akashic-world-engine-dev
    runtime: docker
    region: singapore
    plan: free
    branch: main
    autoDeployTrigger: "off"
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: AUTH_MODE
        value: locked
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "10000"
      - key: DB_POOL_SIZE
        value: "3"
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:MaxRAMPercentage=60.0 -XX:InitialRAMPercentage=15.0"
